<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DBdle – Dragon Ball</title>
<style>
:root{--bg:#fff7ec;--fg:#2a1a0a;--card:#ffffff;--bd:#e6d3b8;--ok:#2e9e4f;--no:#d64545;--mid:#e0a020;--ac:#f08a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110c;--fg:#f6ead8;--card:#241c13;--bd:#4a3b28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15110c;--fg:#f6ead8;--card:#241c13;--bd:#4a3b28;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:1100px;margin-inline:auto;padding:14px}
h1{margin:4px 0;text-align:center;font-size:30px;letter-spacing:1px;color:var(--ac)}
.sub{text-align:center;font-size:13px;opacity:.7;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1;min-width:max-content;padding:9px 10px;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.box{display:flex;gap:6px}
input{flex:1;padding:12px;font-size:16px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);min-width:0}
.go{padding:0 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;font-size:15px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.hint{padding:8px 10px;border-left:4px solid var(--ac);margin:6px 0;background:var(--bg);border-radius:6px;font-size:15px}
.lock{opacity:.4;border-left-color:var(--bd)}
.g{display:inline-block;padding:4px 9px;margin:3px 3px 0 0;border-radius:8px;background:var(--no);color:#fff;font-size:13px}
.row{display:grid;grid-template-columns:minmax(70px,1.3fr) repeat(7,minmax(0,1fr));gap:4px;margin:5px 0;font-size:11.5px;text-align:center}
.row div{padding:8px 2px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;min-height:42px;word-break:break-word}
.row .hd{background:none;color:var(--fg);opacity:.6;min-height:0;padding:0;font-weight:700}
.row .nm{background:var(--card);color:var(--fg);border:2px solid var(--bd);font-weight:700}
.y{background:var(--ok)}.n{background:var(--no)}
.msg{text-align:center;font-weight:700;font-size:17px;padding:12px}
.sm{background:none;border:2px solid var(--bd);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:600;margin:4px}
.ctr{text-align:center}
body{background:transparent}html{background:var(--bg)}
#wp{position:fixed;inset:0;z-index:-1;pointer-events:none}#wp svg{display:block;width:100%;height:100%}
.nm{flex-direction:column;gap:3px}
.rv{opacity:0;animation:fi .8s ease forwards}
@keyframes fi{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
@media(max-width:600px){.row{font-size:9.5px;gap:3px}.row div{padding:6px 1px;min-height:38px}.nm svg,.nm img{width:30px!important;height:30px!important}}.row .hd{background:var(--card);opacity:.9;border-radius:6px;padding:4px 2px}.sub{background:var(--card);border-radius:8px;padding:5px 8px}

h1{font:900 46px Impact,"Arial Black",sans-serif;letter-spacing:3px;color:#ffb000;-webkit-text-stroke:2px #7a2200;paint-order:stroke fill;text-shadow:0 4px 0 #7a2200;margin:2px 0 8px}
h1::before{content:"";display:inline-block;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd24a,#f08a00);border:3px solid #7a2200;vertical-align:middle;margin-right:8px}
.sub,.bubble,.box,.card,.hint,.msg,.leg,.sm,.go{background:#f6e7c1;color:#3a2410;border:3px solid #5a3b1a;border-radius:14px}
.sub{display:table;margin:0 auto 10px;font-weight:700;border-width:2px}
.tabs{justify-content:center;gap:14px;overflow:visible}
.tabs button,.tabs button.on{flex:none;width:76px;min-width:0;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;text-shadow:0 1px 3px #000}
.tabs b{font-size:11px}
.tabs i{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd24a,#f08a00 60%,#c25a00);border:3px solid #5a3b1a;box-shadow:0 0 0 3px #f6e7c1;display:flex;align-items:center;justify-content:center;color:#c4200f;font-style:normal;font-size:12px;line-height:1;padding:8px;word-break:break-all;text-shadow:none}
.tabs button.on i{box-shadow:0 0 0 3px #fff,0 0 16px 5px #ffd24a}
.bubble{text-align:center;font-weight:800;font-size:17px;padding:14px 16px;margin:12px auto;max-width:420px;box-shadow:0 0 0 3px #f6e7c1}
.box{max-width:420px;margin:0 auto 10px;padding:8px}
input{background:#fff8e6;color:#3a2410;border:2px solid #d8bf8a}
.go{padding:0 12px;display:flex;align-items:center}
#out{max-width:820px;margin-inline:auto}
.row{grid-auto-rows:60px;font-size:13px;gap:5px}.row.rh{grid-auto-rows:auto}
.row>div{border-radius:8px;border:2px solid rgba(0,0,0,.35);font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);position:relative;overflow:hidden;min-height:0}
.row .hd{background:none;border:0;border-bottom:2px solid #f6e7c1;border-radius:0;opacity:1;text-transform:uppercase;font-size:10px;padding:0 0 4px}
.row .nm{display:block;padding:0;background:#6b4a28;border-color:#3a2410}
.nm img,.nm svg{display:block;width:100%!important;height:100%!important;border-radius:0!important;border:0!important;object-fit:cover}
.nm span{position:absolute;left:0;right:0;bottom:0;font-size:9px;background:rgba(0,0,0,.65);color:#fff;padding:2px 1px;line-height:1.1}
.row>div>span{position:relative;z-index:1}
.up::before,.dn::before{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;color:rgba(60,0,0,.4)}
.up::before{content:"▲"}.dn::before{content:"▼"}
.hint{padding:8px 12px;border-width:2px}.lock{opacity:.55}
.msg{padding:12px;margin:10px 0}
.leg{max-width:420px;margin:14px auto;padding:10px;text-align:center;position:relative;display:block}
.leg b{display:block;margin-bottom:8px}#lx{position:absolute;right:12px;top:6px;cursor:pointer;font-weight:900}
.lgi{display:flex;justify-content:space-around;font-size:12px}.lgi div{display:flex;flex-direction:column;align-items:center;gap:4px}
.lgi i{width:34px;height:34px;border-radius:6px;position:relative;display:block}
.sm{font-weight:700}
@media(max-width:600px){.row{font-size:9.5px;gap:3px}.row>div{padding:0 1px}.up::before,.dn::before{font-size:40px}h1{font-size:38px}}

.box{position:relative}
#sg{position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:330px;overflow-y:auto;background:#fffdf5;border:3px solid #5a3b1a;border-radius:10px;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#sg:empty{display:none}
#sg>div{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid #d8bf8a;cursor:pointer;color:#3a2410}
#sg>div:hover{background:#f6e7c1}
#sg svg,#sg img{border-radius:5px!important;flex:none;object-fit:cover;object-position:top}
#sg span{display:flex;flex-direction:column;min-width:0}#sg small{opacity:.65;font-size:11px}
#out{max-width:900px}
.row{grid-template-columns:minmax(84px,1.2fr) repeat(7,minmax(0,1fr));grid-auto-rows:minmax(76px,auto);font-size:14px}.row.rh{grid-auto-rows:auto}
.row>div{padding:4px 3px}
@media(max-width:600px){.row{grid-template-columns:minmax(62px,1.2fr) repeat(7,minmax(0,1fr));grid-auto-rows:minmax(66px,auto);font-size:10px}}
.row{grid-auto-rows:minmax(110px,auto)}.row.rh{grid-auto-rows:auto}
.nm img,.nm svg{position:absolute;inset:0}
@media(max-width:600px){.row{grid-auto-rows:minmax(84px,auto)}}
.g{display:inline-flex;align-items:center;margin:3px 4px 0 0}
</style>
</head>
